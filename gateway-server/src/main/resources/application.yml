server:
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: ${GATEWAY_PORT:8765}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ai-db-query-gateway
  datasource:
    url: jdbc:sqlite:${gateway.data-dir}/gateway.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

gateway:
  data-dir: ${GATEWAY_DATA_DIR:${user.home}/Library/Application Support/AI DB Query Gateway}
  remote-enabled: ${GATEWAY_REMOTE_ENABLED:false}
  secrets:
    helper-path: ${GATEWAY_KEYCHAIN_HELPER:native/macos-keychain/build/keychain-helper}
    allow-in-memory: ${GATEWAY_ALLOW_IN_MEMORY_SECRETS:false}
  query:
    default-max-rows: 200
    hard-max-rows: 1000
    max-sql-bytes: 32768
    max-response-bytes: 5242880
    max-field-bytes: 262144
    global-concurrency: 4
    per-data-source-concurrency: 2
    approval-ttl: 5m
    # 仅作为首次启动默认值；网页安全设置中的管理员开关会持久化覆盖它。
    approval-required: ${GATEWAY_QUERY_APPROVAL_REQUIRED:true}
  security:
    token-rate-per-minute: 30
    absolute-session-timeout: 8h

logging:
  level:
    root: INFO
    com.tangguo.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
